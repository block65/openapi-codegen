name: Deploy

on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          cache: "pnpm"

      - run: pnpm install

      # Spelled out rather than `just`, which runners do not ship.
      - run: pnpm exec tsc

      # the trusted publisher grants "npm stage publish", so this uploads for
      # review rather than going live. approve it with pnpm stage approve.
      # provenance is attached automatically when publishing over oidc
      - run: pnpm stage publish --access public --no-git-checks
